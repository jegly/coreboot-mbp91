# GRUB runtime config for coreboot on MacBookPro9,1.
#
# Lives in CBFS as etc/grub.cfg. The payload's built-in config does:
#     if test -f (cbfsdisk)/etc/grub.cfg; then source (cbfsdisk)/etc/grub.cfg; fi
# so without this file GRUB drops straight to a bare rescue prompt.
#
# This file is inside the flash chip, not on disk -- wiping or replacing the
# SSD does not affect it.

# ---------------------------------------------------------------------------
# AFTER REINSTALLING UBUNTU / REPLACING THE SSD
#
# This file lives in the flash chip, NOT on the disk -- wiping or swapping the
# SSD does not remove it. Entry 1 keeps working automatically, because it
# searches for whatever /grub/grub.cfg the new install created and hands over
# to it. New kernels, new UUIDs, a different disk: all fine, no reflash.
#
# Entries 2 and 3 hardcode root=/dev/mapper/ubuntu--vg-ubuntu--lv, which is
# THIS install's LVM name. After a reinstall they may be wrong. Press 'e' at
# the menu to edit an entry before booting, or 'c' for a command line -- no
# reflash needed.
#
# THE ONE THING THAT WOULD BREAK EVERYTHING: if /boot ends up INSIDE the LUKS
# container (full-disk encryption with no separate /boot partition), GRUB here
# cannot read it -- this payload has no cryptodisk module. Ubuntu's guided
# "encrypt the new installation" normally creates a separate unencrypted
# /boot, which is what you want. Check that after any reinstall.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# AUTHENTICATION - FULL LOCK
#
# With superusers set and no entry marked --unrestricted, GRUB requires
# authentication before ANY menu entry will boot, and before 'e' (edit) or
# 'c' (command line) will work. That includes the USB installer entries.
#
# GRUB prompts for a USERNAME first, then the password. The username is
# "admin" (below), NOT your Linux username.
#
# This config lives in the write-protected flash chip, so it cannot be
# bypassed by modifying anything on disk.
#
# !!! IF YOU FORGET THIS PASSWORD, THE ONLY FIX IS TO OPEN THE CASE AND
# !!! REFLASH THE CHIP. There is no reset. It does NOT protect your data --
# !!! LUKS does that. This stops someone tampering with the boot line or
# !!! booting their own USB.
# ---------------------------------------------------------------------------
set superusers="admin"
password_pbkdf2 admin REPLACE_WITH_YOUR_PBKDF2_HASH

set timeout=5
set default=0

# Text mode: coreboot is built with VGA_TEXT_FRAMEBUFFER.
terminal_output console

# --------------------------------------------------------------------------
# 1. Normal boot: hand over to Ubuntu's own GRUB config on /boot (sda2).
#    This picks up every installed kernel, recovery entries and any changes
#    made by update-grub, with no need to reflash.
# --------------------------------------------------------------------------
menuentry "Ubuntu (on-disk GRUB menu)" {
	search --no-floppy --file --set=root /grub/grub.cfg
	configfile /grub/grub.cfg
}

# --------------------------------------------------------------------------
# 2. Direct boot, bypassing the on-disk config entirely. Useful if
#    update-grub has produced a broken grub.cfg.
#    The initrd unlocks the LUKS root; GRUB only reads the plain /boot.
# --------------------------------------------------------------------------
menuentry "Ubuntu (direct, bypass on-disk config)" {
	search --no-floppy --file --set=root /vmlinuz
	linux /vmlinuz root=/dev/mapper/ubuntu--vg-ubuntu--lv ro
	initrd /initrd.img
}

menuentry "Ubuntu (direct, previous kernel)" {
	search --no-floppy --file --set=root /vmlinuz.old
	linux /vmlinuz.old root=/dev/mapper/ubuntu--vg-ubuntu--lv ro
	initrd /initrd.img.old
}

# --------------------------------------------------------------------------
# 3. Boot an Ubuntu installer / live USB.
#    Works with a stick written by GNOME Disks "Restore Disk Image" (a raw
#    block copy), because the payload includes the iso9660 driver and usbms.
#    NOTE: GRUB here has no xhci driver, so use a USB 2.0 port if a stick in
#    a USB 3.0 port is not found.
#
#    modprobe.blacklist=mei,mei_me is deliberate. The hardened descriptor
#    sets FLMSTR2 = 0, denying the Intel ME all flash access including its
#    own region, so the ME never starts. Live media does not carry this
#    machine's /etc/modprobe.d blacklist, so mei_me tries to init, times
#    out, and prints a wall of errors before disabling itself. Harmless, but
#    alarming. Verified on hardware: with this parameter the live USB boots
#    clean.
#
#    KNOWN QUIRK: with a USB stick already inserted at power-on, the menu is
#    flooded with "unknown key 0xff detected". Cosmetic only, arrow keys and
#    the password prompt still work. Upstream GRUB bug: usb_keyboard.c passes
#    raw 0xFF keycodes to grub_term_map_key(), while ps2.c filters them. To
#    avoid it, insert the stick after selecting the entry.
# --------------------------------------------------------------------------
menuentry "Boot Ubuntu installer from USB" {
	search --no-floppy --file --set=root /casper/vmlinuz
	linux /casper/vmlinuz boot=casper quiet splash modprobe.blacklist=mei,mei_me ---
	initrd /casper/initrd
}

menuentry "Boot Ubuntu installer from USB (safe graphics)" {
	search --no-floppy --file --set=root /casper/vmlinuz
	linux /casper/vmlinuz boot=casper nomodeset modprobe.blacklist=mei,mei_me ---
	initrd /casper/initrd
}

# --------------------------------------------------------------------------
# 4. Utilities
# --------------------------------------------------------------------------
menuentry "List all detected disks and partitions" {
	ls
	echo "Press any key to continue..."
	read
}

menuentry "Reboot" {
	reboot
}

menuentry "Power off" {
	halt
}

# Press 'c' at this menu for a GRUB command line, or 'e' to edit an entry.
